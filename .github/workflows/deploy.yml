name: Deploy FOSSBilling

on:
  workflow_dispatch:  # manual only — safe while FOSSBilling is not production yet

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # Repo composer.json maps classes under src/library with vendor-dir=src/vendor.
      # Flatten autoload for the deployed webroot WITHOUT wiping vendor package maps
      # (a minimal COMPOSER= tempfile dump-autoload previously dropped Symfony/etc.).
      - name: Regenerate autoload for flat webroot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("composer.json")
          data = json.loads(root.read_text())
          data["autoload"] = {
              "psr-0": {
                  "Payment_": "library/",
                  "Registrar_": "library/",
                  "Server_": "library/",
              },
              "psr-4": {"Box\\Mod\\": "modules/"},
              "classmap": ["library/"],
          }
          data["config"]["vendor-dir"] = "vendor"
          Path("src/composer.json").write_text(json.dumps(data, indent=4) + "\n")
          PY
          cp composer.lock src/composer.lock
          (cd src && composer dump-autoload -o --no-dev --no-interaction)
          if grep -q "src/library" src/vendor/composer/autoload_classmap.php; then
            echo "ERROR: webroot autoload still references src/library" >&2
            exit 1
          fi
          if ! grep -q 'Symfony\\\\Component\\\\Filesystem\\\\' src/vendor/composer/autoload_psr4.php; then
            echo "ERROR: vendor package PSR-4 maps missing after dump-autoload" >&2
            exit 1
          fi
          # Avoid shipping root composer files into the webroot as required app files
          rm -f src/composer.json src/composer.lock

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build-core
          npm run build-admin_default
          npm run build-huraga
          grep -q 'fossbilling_csrf' src/public/assets/js/api.js

      - name: Deploy src/ to server via rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "src/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/billing.vioflare.com/"
          EXCLUDE: "config.php, config.old.php, data/log/, data/cache/, data/uploads/, themes/huraga/config/settings_data.json, composer.json, composer.lock"
          SCRIPT_BEFORE: |
            set -euo pipefail
            TARGET="/var/www/billing.vioflare.com"
            sudo mkdir -p "${TARGET}"
            sudo chown -R "$(whoami):www-data" "${TARGET}"
            sudo chmod u+rwx "${TARGET}"
          SCRIPT_AFTER: |
            set -euo pipefail
            TARGET="/var/www/billing.vioflare.com"
            mkdir -p "${TARGET}/data/log" "${TARGET}/data/cache" "${TARGET}/data/uploads"
            # Never leave the installer web-accessible after rsync --delete
            rm -rf "${TARGET}/install"
            # Theme settings are gitignored; restore from example if missing
            HURAGA_SETTINGS="${TARGET}/themes/huraga/config/settings_data.json"
            HURAGA_EXAMPLE="${TARGET}/themes/huraga/config/settings_data.json.example"
            if [[ ! -f "${HURAGA_SETTINGS}" && -f "${HURAGA_EXAMPLE}" ]]; then
              cp "${HURAGA_EXAMPLE}" "${HURAGA_SETTINGS}"
            fi
            sudo chown -R www-data:www-data "${TARGET}"
            sudo chmod g+w "${TARGET}" || true
            sudo chmod 664 "${TARGET}/config.php" "${TARGET}/config.old.php" 2>/dev/null || true
            sudo find "${TARGET}/data" -type d -exec chmod 775 {} \;
            sudo find "${TARGET}/data/log" "${TARGET}/data/cache" "${TARGET}/data/uploads" -type d -exec chmod 775 {} \;
            # Apply DB/config patches after code deploy (Doctrine upgrades, etc.)
            if [[ -f "${TARGET}/console.php" ]]; then
              sudo -u www-data php "${TARGET}/console.php" system:run-patcher || true
            fi
            echo "Deploy complete: ${TARGET}"
            ls -la "${TARGET}" | head -30
